name: Release candidate

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools
      - run: .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - shell: powershell
        run: .\release.ps1
        env:
          QT_QPA_PLATFORM: offscreen
      - id: release_version
        shell: powershell
        run: |
          $version = .\.venv\Scripts\python.exe -c "from grande_alpha import __version__; print(__version__)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: grande-alpha-release-candidate
          if-no-files-found: error
          path: |
            release/grande-alpha-${{ steps.release_version.outputs.version }}-unsigned-windows-x64.zip
            release/grande-alpha-${{ steps.release_version.outputs.version }}-unsigned-windows-x64.zip.sha256
            release/grande-alpha-${{ steps.release_version.outputs.version }}-windows-source.zip
            release/grande-alpha-${{ steps.release_version.outputs.version }}-windows-source.zip.sha256
