name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m compileall -q src
      - run: python -m build
      - run: python -m pip_audit

  package:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - shell: powershell
        run: .\build.ps1
      - name: Audit packaged Python metadata present in the frozen tree
        run: >-
          python -m pip_audit --strict --progress-spinner off
          --path dist/GRANDEAlpha/_internal
      # Smoke-build only. Do not upload this unsigned tree from ordinary push/PR CI.
      # Public candidate artifacts remain isolated to the manual/tag release workflow.
