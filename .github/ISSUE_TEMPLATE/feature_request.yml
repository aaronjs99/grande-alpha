name: Feature request
description: Propose a product, research, documentation, or accessibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Explain the user need, not just a preferred implementation. Features may not bypass evidence, consent, privacy, or risk controls.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior and who benefits.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, privacy, and evidence impact
      description: Note external connections, permissions, money movement, data retention, or claim risks.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
