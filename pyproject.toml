[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grande-alpha"
dynamic = ["version"]
description = "Local-first leveraged-ETF strategy research and consent-gated execution workstation"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "GRANDE Alpha contributors"}]
requires-python = ">=3.11,<3.13"
keywords = ["algorithmic-trading", "backtesting", "desktop", "research", "risk-management"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "mcp>=1.29,<2",
  "numpy>=2.1,<3",
  "platformdirs>=4.3,<5",
  "pywin32>=311,<313; sys_platform == 'win32'",
  "tzdata>=2026.1",
]

[project.urls]
Homepage = "https://github.com/aaronjs99/grande-alpha"
Documentation = "https://github.com/aaronjs99/grande-alpha/tree/master/docs"
Issues = "https://github.com/aaronjs99/grande-alpha/issues"
Repository = "https://github.com/aaronjs99/grande-alpha.git"
Changelog = "https://github.com/aaronjs99/grande-alpha/blob/master/CHANGELOG.md"

[project.optional-dependencies]
desktop = [
  "pyqtgraph>=0.13.7,<0.15",
  "PySide6>=6.8,<7",
  "qasync>=0.27,<1",
]
dev = [
  "build>=1.3,<2",
  "cyclonedx-bom>=7.1,<8",
  "pip-audit>=2.9,<3",
  "pyinstaller>=6.13,<7",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
grande-alpha = "grande_alpha.app:main"
grande-alpha-cli = "grande_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["grande_alpha*"]

[tool.setuptools.dynamic]
version = {attr = "grande_alpha._version.__version__"}

[tool.setuptools.package-data]
grande_alpha = ["assets/*.png"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
