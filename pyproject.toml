[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grande-alpha"
version = "0.11.0"
description = "Local-first leveraged-ETF strategy research and consent-gated execution workstation"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "AaronJS"}]
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "mcp>=1.29,<2",
  "numpy>=2.1,<3",
  "platformdirs>=4.3,<5",
  "pyqtgraph>=0.13.7,<0.15",
  "PySide6>=6.8,<7",
  "pywin32>=311,<313; sys_platform == 'win32'",
  "qasync>=0.27,<1",
  "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "cyclonedx-bom>=7.1,<8",
  "pip-audit>=2.9,<3",
  "pyinstaller>=6.13,<7",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
grande-alpha = "grande_alpha.app:main"
grande-alpha-cli = "grande_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grande_alpha = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
