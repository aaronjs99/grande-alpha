[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grande-alpha"
version = "0.3.0"
description = "GRANDE Alpha live-gated TQQQ/SQQQ trader for Robinhood Agentic Trading"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "mcp>=1.29,<2",
  "numpy>=2.1,<3",
  "platformdirs>=4.3,<5",
  "pyqtgraph>=0.13.7,<0.15",
  "PySide6>=6.8,<7",
  "qasync>=0.27,<1",
  "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.13,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
grande-alpha = "grande_alpha.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
